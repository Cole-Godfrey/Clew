[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "clew"
version = "0.1.0"
description = "A URL shortener with persistent links and click counts"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
pythonanywhere = ["a2wsgi>=1.10.10,<2"]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["clew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
