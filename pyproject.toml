[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "shorturl"
version = "0.1.0"
description = "A small, persistent URL shortener API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["shorturl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
